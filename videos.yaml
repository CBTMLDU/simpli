# ---------------------------------------------------------------------------
# videos.yaml — the workshop video manifest
#
# Every {{VIDEO: some-id}} placeholder in docs/*.md has an entry here.
# build.py reads this file and replaces each placeholder with the right embed.
#
# source: youtube  -> embeds the original (correct for anything you did not make)
#         local    -> a file in docs/assets/video/, autoplays on scroll
#
# caption: write what to LOOK FOR, not just what it is.
# ---------------------------------------------------------------------------

