site_name: Molecular Dynamics Simulation Workshop
site_description: A hands-on introduction to molecular dynamics with GROMACS
site_author: Clinical Biochemistry and Translational Medicine Laboratory
site_url: https://cbtmldu.github.io/md-workshop/

repo_url: https://github.com/CBTMLDU/md-workshop
repo_name: CBTMLDU/md-workshop
docs_dir: build
edit_uri: edit/main/docs/

theme:
  name: material
  language: en
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - navigation.footer
    - toc.follow
    - content.code.copy
    - content.action.edit
    - search.highlight
    - search.suggest
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue grey
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue grey
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  font:
    text: Archivo
    code: JetBrains Mono

nav:
  - Home: index.md
  - 1. What is an MD simulation: 01-basics.md
  - 2. Scope and limitations: 02-scope-and-limitations.md
  - 3. Running a simulation: 03-running-a-simulation.md
  - 4. Analysis: 04-analysis.md
  - 5. Advanced Sampling: 05-enhanced-sampling.md
  - 6. Machine Learning in MD: 06-machine-learning.md
  - 7. Back to the wet lab: 07-back-to-the-wet-lab.md
  - 8. How to contribute: contributing.md
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - footnotes
  - tables
  - toc:
      permalink: true
      toc_depth: 4
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true

extra_javascript:
  - javascripts/video-autoplay.js

extra_css:
  - stylesheets/extra.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/cbtml

copyright: >
  Clinical Biochemistry and Translational Medicine Laboratory, University of Dhaka
